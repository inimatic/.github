name: Deliver qualified main to Root
description: Submit a bounded release to each Root's forced-command SSH admission.
inputs:
  kind:
    description: core or backend
    required: true
  revision:
    description: Exact qualified source SHA
    required: true
  run-id:
    description: Successful Core run or qualified infrastructure image run
    required: true
  run-attempt:
    description: Producer run attempt
    required: true
  image:
    description: Immutable backend registry image
    default: ''
  targets:
    description: Dedicated forced-command SSH identities, supplied from a repository secret
    required: true
  token:
    description: Short-lived Actions token for provenance and registry readback
    required: true
  dry-run:
    description: Validate live admission without changing any service
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DELIVERY_KIND: ${{ inputs.kind }}
        DELIVERY_REVISION: ${{ inputs.revision }}
        DELIVERY_RUN_ID: ${{ inputs.run-id }}
        DELIVERY_RUN_ATTEMPT: ${{ inputs.run-attempt }}
        DELIVERY_IMAGE: ${{ inputs.image }}
        DELIVERY_TARGETS: ${{ inputs.targets }}
        DELIVERY_TOKEN: ${{ inputs.token }}
        DELIVERY_DRY_RUN: ${{ inputs.dry-run }}
      run: python3 "${{ github.action_path }}/deliver.py"
