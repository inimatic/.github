name: Shared CI policy checks
on:
  push:
    branches: [main, dev2027]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/nightly-gate.test.cjs
      - run: python3 tests/root-delivery.test.py
