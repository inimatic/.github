name: Shared CI policy checks
on:
  push:
    branches: [main]
    paths: ['.github/actions/**', '.github/workflows/ci.yml', 'tests/**']
  pull_request:
    # Required status: keep documentation PRs mergeable.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-policy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/nightly-gate.test.cjs
      - run: python3 -B tests/root-delivery.test.py
